<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Immigration Interviews</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #f8fafc; color: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 2.5rem; max-width: 420px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.06); }
        .brand { display: flex; align-items: center; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem; }
        .brand img { height: 64px; width: 64px; object-fit: contain; }
        .brand span { font-weight: 800; font-size: 1.1rem; white-space: nowrap; }
        h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.4rem; text-align: center; }
        .sub { color: #64748b; text-align: center; margin-bottom: 1.5rem; font-size: 0.95rem; }
        label { display: block; font-weight: 600; color: #374151; margin-bottom: 0.4rem; font-size: 0.85rem; }
        .form-group { margin-bottom: 1.1rem; }
        input { width: 100%; padding: 0.85rem 1rem; border: 2px solid #e2e8f0; border-radius: 0.5rem; font-size: 1rem; font-family: inherit; }
        input:focus { outline: none; border-color: #1e40af; }
        button { width: 100%; padding: 0.9rem; background: #1e40af; color: #fff; border: none; border-radius: 0.5rem; font-size: 1rem; font-weight: 700; cursor: pointer; }
        button:hover { background: #1e3a8a; }
        button:disabled { opacity: 0.6; cursor: default; }
        .alert { padding: 0.8rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
        .alert.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; display: block; }
        .alert.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; display: block; }
        .link { text-align: center; margin-top: 1.25rem; font-size: 0.9rem; }
        .link a { color: #1e40af; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <img src="immigrationinterviews_logo.png" alt="Immigration Interviews">
            <span>Immigration <span style="color:#dc2626;">Interviews</span></span>
        </div>
        <h1>Set a new password</h1>
        <p class="sub">Enter a new password for your account.</p>

        <div class="alert error" id="errBox"></div>
        <div class="alert success" id="okBox"></div>

        <form id="resetForm" onsubmit="submitReset(event)">
            <div class="form-group">
                <label for="pw1">New password</label>
                <input type="password" id="pw1" placeholder="At least 6 characters" minlength="6" required>
            </div>
            <div class="form-group">
                <label for="pw2">Confirm new password</label>
                <input type="password" id="pw2" placeholder="Re-enter your new password" minlength="6" required>
            </div>
            <button type="submit" id="submitBtn">Update password</button>
        </form>

        <p class="link"><a href="index.html">← Back to login</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://vugvnqapdxyewxyfaayl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_vFFY4GL2f8PIGrArW05ncg_PVkcgV4M';
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const errBox = document.getElementById('errBox');
        const okBox = document.getElementById('okBox');
        let canReset = false;

        // When arriving from the email link, Supabase establishes a temporary
        // recovery session. We wait for it before allowing the password change.
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY' || session) canReset = true;
        });

        // Fallback: if a session already exists shortly after load, allow it.
        setTimeout(async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) canReset = true;
            if (!canReset) {
                errBox.textContent = 'This reset link is invalid or has expired. Please request a new one from the login page.';
                errBox.style.display = 'block';
            }
        }, 1500);

        async function submitReset(e) {
            e.preventDefault();
            errBox.style.display = 'none';
            okBox.style.display = 'none';
            const pw1 = document.getElementById('pw1').value;
            const pw2 = document.getElementById('pw2').value;
            const btn = document.getElementById('submitBtn');

            if (pw1 !== pw2) {
                errBox.textContent = 'The two passwords do not match.';
                errBox.style.display = 'block';
                return;
            }
            if (!canReset) {
                errBox.textContent = 'This reset link is invalid or has expired. Please request a new one from the login page.';
                errBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating...';
            try {
                const { error } = await supabaseClient.auth.updateUser({ password: pw1 });
                if (error) throw error;
                okBox.textContent = 'Your password has been updated. You can now log in with your new password.';
                okBox.style.display = 'block';
                document.getElementById('resetForm').style.display = 'none';
                setTimeout(() => { window.location.href = 'index.html'; }, 2500);
            } catch (error) {
                console.error(error);
                errBox.textContent = error.message || 'Could not update the password. Please request a new reset link.';
                errBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Update password';
            }
        }
    </script>
</body>
</html>
