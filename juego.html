<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camino a la Ciudadanía | Immigration Interviews</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* Juego: "Camino a la Ciudadanía". Mundo único (no cambia con el tema del sistema): cielo azul, tarjetas blancas,
   botones gruesos con sombra inferior, estrellas doradas, corazones rojos. Móvil primero; columna de 560px para jugar. */
:root{
  color-scheme:light;
  --sky1:#1e40af; --sky2:#312e81; --sky3:#4c1d95;
  --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --soft:#f1f5f9;
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-dd:#1e3a8a;
  --gold:#facc15; --gold-d:#ca8a04; --gold-ink:#422006;
  --green:#22c55e; --green-d:#15803d; --green-bg:#dcfce7;
  --red:#ef4444; --red-d:#b91c1c; --red-bg:#fee2e2;
  --purple:#8b5cf6; --pink:#ec4899; --teal:#14b8a6;
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--body);color:var(--ink);font-size:17px;line-height:1.45;
  background:radial-gradient(1200px 600px at 50% -10%, #3b82f6 0%, transparent 60%),
             linear-gradient(170deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%) fixed;
  background-color:var(--sky2)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 120px 80px,#fff,transparent),
  radial-gradient(1px 1px at 200px 150px,#fff,transparent),radial-gradient(1.5px 1.5px at 300px 40px,#fff,transparent),
  radial-gradient(1px 1px at 380px 210px,#fff,transparent);background-size:420px 260px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
a{color:inherit}
.hidden{display:none!important}

/* Top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:rgba(15,23,42,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff}
.top .back{font-weight:800;text-decoration:none;background:rgba(255,255,255,.14);border-radius:99px;padding:6px 14px;font-size:15px;white-space:nowrap}
.top .title{font-family:var(--display);font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);border-radius:99px;padding:5px 11px;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.iconbtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:17px}
.lang{display:flex;background:rgba(255,255,255,.14);border-radius:99px;padding:3px}
.lang button{padding:3px 9px;border-radius:99px;font-weight:900;font-size:13px;color:#cbd5e1}
.lang button.on{background:#fff;color:var(--blue-dd)}
@media (max-width:520px){.top .title{display:none}.pill.hide-sm{display:none}}

.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px;position:relative}
.narrow{max-width:560px;margin:0 auto}

/* Generic chunky buttons */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-weight:700;font-size:19px;
  border-radius:18px;padding:13px 22px;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-dd);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-dd)}
.btn.gold{background:var(--gold);color:var(--gold-ink);box-shadow:0 5px 0 var(--gold-d)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-d)}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.btn.green:active{box-shadow:0 1px 0 var(--green-d)}
.btn.ghost{background:#fff;color:var(--blue-dd);box-shadow:0 5px 0 #cbd5e1}
.btn.ghost:active{box-shadow:0 1px 0 #cbd5e1}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}

/* Home */
.hero{color:#fff;text-align:center;padding:10px 0 18px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,6vw,48px);line-height:1.05;text-wrap:balance;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.hero p{opacity:.85;margin-top:6px;font-weight:700}
.player{background:var(--card);border-radius:26px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.avatar{width:70px;height:70px;border-radius:22px;background:linear-gradient(135deg,var(--gold),#fb923c);display:grid;place-items:center;
  font-family:var(--display);font-weight:700;font-size:30px;color:var(--gold-ink);position:relative}
.avatar .lv{position:absolute;bottom:-8px;right:-8px;background:var(--blue);color:#fff;font-size:13px;border-radius:99px;padding:2px 8px;border:3px solid #fff}
.pname{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1}
.prank{color:var(--muted);font-weight:800;font-size:14px}
.xpbar{height:14px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fb923c);border-radius:99px;transition:width .6s}
.xptxt{font-size:13px;color:var(--muted);font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:16px;padding:8px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);font-weight:800}

.worlds{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:22px}
@media (max-width:820px){.worlds{grid-template-columns:1fr}}
.world{border-radius:26px;padding:20px;color:#fff;text-align:left;position:relative;overflow:hidden;
  box-shadow:0 7px 0 rgba(0,0,0,.25);transition:transform .12s;display:flex;flex-direction:column;gap:6px;min-height:190px}
.world:hover{transform:translateY(-3px)}
.world:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.world.civ{background:linear-gradient(140deg,#3b82f6,#1d4ed8)}
.world.def{background:linear-gradient(140deg,#a855f7,#7c3aed)}
.world.wri{background:linear-gradient(140deg,#f472b6,#db2777)}
.world.rev{background:linear-gradient(140deg,#14b8a6,#0f766e)}
.world .big{position:absolute;right:-10px;bottom:-24px;font-size:120px;opacity:.22;line-height:1}
.world h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1}
.world p{opacity:.92;font-weight:700;font-size:15px;max-width:30ch}
.world .meta{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.world .meta span{background:rgba(255,255,255,.2);border-radius:99px;padding:3px 11px;font-weight:900;font-size:14px}
.how{margin-top:22px;background:rgba(255,255,255,.12);color:#e0e7ff;border-radius:20px;padding:14px 18px;font-weight:700;font-size:15px}
.how b{color:#fff}

/* Map */
.maphead{background:var(--card);border-radius:24px;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px}
.maphead .row1{display:flex;align-items:center;gap:12px}
.maphead .wicon{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:28px;color:#fff;flex:none}
.maphead h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1}
.maphead .sub{color:var(--muted);font-weight:800;font-size:14px}
.seg{display:inline-flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:7px 14px;border-radius:11px;font-weight:900;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}
.opts-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.opts-row select{font:inherit;font-weight:800;font-size:15px;border:2px solid var(--line);border-radius:12px;padding:7px 10px;background:#fff;color:var(--ink);max-width:100%}
.opts-row label{font-weight:800;font-size:14px;color:var(--muted)}
.quick{display:flex;gap:10px;flex-wrap:wrap}
.path{display:flex;flex-direction:column;align-items:center;gap:0;padding:26px 0 10px}
.node-wrap{display:flex;flex-direction:column;align-items:center;position:relative}
.node{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:30px;
  background:#fff;color:var(--blue-dd);box-shadow:0 7px 0 #94a3b8;transition:transform .1s;position:relative;margin-top:34px}
.node-wrap:first-child .node{margin-top:0}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 #94a3b8}
.node.done{background:var(--gold);color:var(--gold-ink);box-shadow:0 7px 0 var(--gold-d)}
.node.next{background:#fff;box-shadow:0 7px 0 var(--blue-dd),0 0 0 6px rgba(250,204,21,.6)}
@media (prefers-reduced-motion:no-preference){.node.next{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 7px 0 var(--blue-dd),0 0 0 6px rgba(250,204,21,.6)}50%{box-shadow:0 7px 0 var(--blue-dd),0 0 0 14px rgba(250,204,21,.15)}}}
.node.locked{background:#cbd5e1;color:#64748b;box-shadow:0 7px 0 #94a3b8;cursor:not-allowed;font-size:26px}
.nstars{margin-top:10px;font-size:18px;letter-spacing:2px;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.25);min-height:22px}
.nstars .off{color:rgba(255,255,255,.3)}
.nlabel{color:#e0e7ff;font-weight:800;font-size:13px;text-align:center;max-width:180px}
.cat-tag{margin-top:26px;background:rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:5px 14px;font-weight:900;font-size:14px}

/* Play */
.playtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.xbtn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:20px;font-weight:900;display:grid;place-items:center;flex:none}
.prog{flex:1;height:18px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#4ade80,var(--green));border-radius:99px;transition:width .4s;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.hearts{color:#fff;font-weight:900;font-size:20px;white-space:nowrap;letter-spacing:1px}
.hearts .lost{opacity:.25;filter:grayscale(1)}
.combo{display:inline-block;background:linear-gradient(135deg,#fb923c,#ef4444);color:#fff;border-radius:99px;padding:3px 12px;font-weight:900;font-size:15px;margin-bottom:10px}
@media (prefers-reduced-motion:no-preference){.combo{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}}
.qcard{background:var(--card);border-radius:26px;padding:22px 20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.qkind{font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--purple);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qkind .again{background:#fef3c7;color:#92400e;border-radius:99px;padding:2px 10px;letter-spacing:0;text-transform:none}
.qtext{font-family:var(--display);font-weight:600;font-size:clamp(22px,4.6vw,28px);line-height:1.2;margin:8px 0 4px;text-wrap:balance}
.qtext .term{color:var(--blue)}
.qsub{color:var(--muted);font-weight:700;font-size:15px}
.speak{display:inline-flex;align-items:center;gap:6px;background:#eff6ff;color:var(--blue-d);border-radius:99px;padding:6px 14px;font-weight:900;font-size:15px;margin-top:10px}
.choices{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px;
  box-shadow:0 4px 0 var(--line);font-weight:800;font-size:17px;line-height:1.25;transition:transform .06s}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.choice .k{flex:none;width:34px;height:34px;border-radius:11px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--muted);font-size:16px}
.choice small{display:block;color:var(--muted);font-weight:700;font-size:14px;margin-top:2px}
.choice.right{border-color:var(--green);background:var(--green-bg);box-shadow:0 4px 0 var(--green)}
.choice.right .k{background:var(--green);border-color:var(--green);color:#fff}
.choice.wrong{border-color:var(--red);background:var(--red-bg);box-shadow:0 4px 0 var(--red)}
.choice.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
.choice[disabled]{cursor:default}
.choice.dim{opacity:.55}
.choice.multi .k{border-radius:8px}
.choice.sel{border-color:var(--blue);background:#eff6ff;box-shadow:0 4px 0 var(--blue)}
.choice.sel .k{background:var(--blue);border-color:var(--blue);color:#fff}
.choice.also{border-color:var(--green);border-style:dashed;background:#f0fdf4;box-shadow:0 4px 0 #bbf7d0}
.choice.also .k{border-color:var(--green);color:var(--green-d)}
.choice .tag{display:block;color:var(--green-d);font-weight:900;font-size:13px;margin-top:2px}
.pickhint{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;font-weight:900;font-size:15px;color:var(--blue-d)}
.pickhint span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}}
.write-in{width:100%;margin-top:18px;font:inherit;font-size:20px;font-weight:700;border:3px solid var(--line);border-radius:18px;padding:14px 16px;color:var(--ink);background:#fff}
.write-in:focus{border-color:var(--blue);outline:none}
.write-in.ok{border-color:var(--green);background:var(--green-bg)}
.write-in.bad{border-color:var(--red);background:var(--red-bg)}
.listen-big{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin-top:16px;padding:22px;border-radius:22px;
  background:linear-gradient(135deg,#f472b6,#db2777);color:#fff;font-family:var(--display);font-weight:700;font-size:22px;box-shadow:0 6px 0 #9d174d}
.listen-big:active{transform:translateY(5px);box-shadow:0 1px 0 #9d174d}
.actions{margin-top:18px}

.fb{margin-top:16px;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.fb.good{background:var(--green-bg);color:#14532d}
.fb.bad{background:var(--red-bg);color:#7f1d1d}
.fb.mid{background:#fef3c7;color:#713f12}
.fb h3{font-family:var(--display);font-weight:700;font-size:22px}
.fb .lbl{font-size:12.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.fb ul{padding-left:20px;font-weight:700}
.fb .say{font-weight:900;font-size:18px}
.fb .xp{font-weight:900}
.fb img{width:140px;height:140px;object-fit:cover;border-radius:16px;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.fb .imgrow{display:flex;gap:10px;flex-wrap:wrap}
.sent{font-weight:900;font-size:19px}
.sent .w-bad{background:#fecaca;border-radius:6px;padding:0 3px}
.sent .w-case{background:#fde68a;border-radius:6px;padding:0 3px}
.kbd-hint{color:rgba(255,255,255,.7);font-weight:700;font-size:13px;text-align:center;margin-top:14px}

/* Result */
.result{background:var(--card);border-radius:28px;padding:26px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.result h2{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.1;text-wrap:balance}
.bigstars{font-size:58px;letter-spacing:6px;margin:10px 0 2px;line-height:1}
.bigstars span{display:inline-block;color:#e2e8f0}
.bigstars span.on{color:var(--gold);text-shadow:0 4px 0 var(--gold-d)}
@media (prefers-reduced-motion:no-preference){.bigstars span.on{animation:starIn .5s both}.bigstars span.on:nth-child(2){animation-delay:.25s}.bigstars span.on:nth-child(3){animation-delay:.5s}
  @keyframes starIn{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1)}}}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.rgrid div{background:var(--soft);border-radius:16px;padding:10px 6px}
.rgrid b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.rgrid span{font-size:13px;color:var(--muted);font-weight:800}
.rbtns{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.missed{text-align:left;margin-top:16px;background:var(--soft);border-radius:18px;padding:14px 16px}
.missed h4{font-family:var(--display);font-size:18px;margin-bottom:6px}
.missed li{margin-left:18px;font-weight:700;font-size:15px;margin-top:4px}
.missed li small{display:block;color:var(--green-d);font-weight:800}
.levelup{background:linear-gradient(135deg,var(--gold),#fb923c);color:var(--gold-ink);border-radius:18px;padding:10px 14px;font-weight:900;margin-top:12px}

.nudge{margin-top:18px;background:linear-gradient(135deg,#fff7d6,#ffe08a);border:3px solid var(--gold);border-radius:24px;padding:16px 18px;
  display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 var(--gold-d);text-align:left;color:var(--gold-ink)}
.nudge h3{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15;text-wrap:balance}
.nudge p{font-weight:700;font-size:15.5px}
.nudge .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.nudge .meta span{background:rgba(255,255,255,.7);border-radius:99px;padding:3px 11px;font-weight:900;font-size:14px}
.nudge .btn{margin-top:8px;align-self:flex-start}
.nudge.new{animation:none}
@media (prefers-reduced-motion:no-preference){.nudge.new{animation:pop .45s ease-out}}
.resetzone{margin-top:22px;text-align:center}
.resetlink{color:#c7d2fe;font-weight:800;font-size:14px;text-decoration:underline;padding:6px}
.resetbox{background:var(--card);border:3px solid var(--red);border-radius:22px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px}
.resetbox h3{font-family:var(--display);font-weight:700;font-size:21px;color:var(--red-d)}
.resetbox p{font-weight:700;font-size:15px}
.resetbox .keep{color:var(--green-d)}
.resetbox .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.btn.red:active{box-shadow:0 1px 0 var(--red-d)}
.loading{color:#fff;text-align:center;padding:60px 0;font-family:var(--display);font-size:22px}
.err{background:var(--card);border-radius:20px;padding:20px;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.overlay{position:fixed;inset:0;background:linear-gradient(170deg,var(--sky1),var(--sky2));z-index:100;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:24px}
</style>
</head>
<body>
<div class="overlay" id="loadingOverlay">…</div>

<header class="top">
  <a class="back" id="backBtn" href="dashboard.html">← Hub</a>
  <div class="title" id="topTitle">Camino a la Ciudadanía</div>
  <div class="sp"></div>
  <span class="pill" id="pStreak" title="">🔥 0</span>
  <span class="pill hide-sm" id="pXp" title="">⭐ 0</span>
  <button class="iconbtn" id="soundBtn" type="button" aria-label="Sonido">🔊</button>
  <div class="lang"><button id="langEs" type="button">ES</button><button id="langEn" type="button">EN</button></div>
</header>

<main class="wrap" id="app"></main>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/tts.js"></script>
<script src="/definitions.js"></script>
<script src="/civics-images.js"></script>

function confetti(){

  const c = document.getElementById('confetti'), x = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;

  const P = Array.from({length:150}, () => ({x:Math.random()*c.width, y:-20-Math.random()*c.height*.5, w:6+Math.random()*7, h:8+Math.random()*10,
    vx:-2+Math.random()*4, vy:2+Math.random()*4, r:Math.random()*6, vr:-.2+Math.random()*.4, c:cols[(Math.random()*cols.length)|0]}));
  const t0 = performance.now();
  (function frame(now){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .05; p.r += p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); });
    if (now - t0 < 3200) requestAnimationFrame(frame); else x.clearRect(0,0,c.width,c.height);
  })(t0);
}

const bankCache = {};
async function loadCivics(test, st){
  const key = test + '|' + (st || '');
  if (bankCache[key]) return bankCache[key];
  const url = '/api/questions?v=' + test + (st ? '&state=' + encodeURIComponent(st) : '');
  const res = await fetch(url); if (!res.ok) throw new Error('bank ' + res.status);
  const data = await res.json();
  bankCache[key] = buildCivItems(data.questions || [], test);
  return bankCache[key];
}
function segs(a){ return String(a).split(';').map(s => s.trim()).filter(Boolean); }
function cleanAns(s){
  s = String(s).replace(/\s*\((name either one|governor of [^)]*)\)/ig, '').trim();
  if (/:\s*/.test(s) && /senators?/i.test(s)) s = s.split(':').slice(1).join(':').split(',')[0].trim();
  s = s.replace(/^\(([^)]*)\)\s*/, '$1 ').replace(/\s+/g,' ').replace(/\.$/, '').trim();
  return s;
}
function qType(q){
  if (/how (many|long|old)|what age|how many years/i.test(q)) return 'num';
  if (/^when\b|what month|in what year|what year/i.test(q)) return 'date';
  if (/^who\b|name of the (president|vice president|speaker|chief justice)|senators? now|governor of your state|name one (of the )?(writer|american indian)/i.test(q)) return 'person';
  if (/^where\b|ocean|river|capital|territor|borders|state that|name one state|what state/i.test(q)) return 'place';
  return 'other';
}
// A person's name: 2-4 capitalized words, not a role like "The President".
function isName(s){ const w = String(s).split(' '); if (/\b(union|states|kingdom|territory|islands?|river|ocean)\b/i.test(s)) return false; return w.length >= 2 && w.length <= 4 && !/^(the|american|a|an)$/i.test(w[0]) && w.every(x => /^[A-Z][A-Za-z.'-]*$/.test(x) || /^(of|de|la|Jr\.?)$/.test(x)); }
function buildCivItems(bank, test){
  const usable = bank.filter(x => !/varies by the applicant|depends on your congressional district|look up your own/i.test(x.a));
  const items = usable.map(x => {
    const all = segs(x.a), correct = cleanAns(all[0]);
    let type = qType(x.q);
    if (type === 'person') type = isName(correct) ? 'name' : 'role';
    else if (type === 'other' && /\bwars?\b/i.test(x.q)) type = 'war';
    // "Name two / What are three…": the student picks at least k correct answers.
    let k = 1, correctSet = null;
    const m = x.q.match(/\b(?:name|what are)\s+(two|three|five)\b/i);
    if (m) {
      k = {two:2, three:3, five:5}[m[1].toLowerCase()];
      let parts = all.map(cleanAns);
      if (parts.length === 1 && parts[0].split(',').length > k) parts = parts[0].split(',').map(p => p.trim());
      correctSet = parts.filter(p => p && p.length <= 90 && !/etc\.?$/i.test(p));
      if (correctSet.length < k) { k = 1; correctSet = null; }
    }
    // One-segment answers that are really a list ("Cherokee, Navajo, Sioux…"): show ONE item as the right option.
    const listItems = (!correctSet && all.length === 1 && all[0].split(',').length >= 3) ? all[0].split(',').map(p => cleanAns(p)).filter(p => p && !/^(and|etc)$/i.test(p)) : null;
    return { kind:'mc', world:'civ', id:'c'+test+'-'+x.n, n:x.n, test, q:x.q, a:x.a, all, correct: listItems ? listItems[0] : correct, listItems, type, k, multi: k > 1, correctSet, orig13: /13 original states/i.test(x.q),
             two: k === 1 && /\b(name|what are)\s+(two|three)\b/i.test(x.q) };
  }).filter(it => it.correct);
  const pools = {};
  const usableWrong = it => !it.listItems && !it.multi && String(it.correct).split(',').length < 3;
  items.forEach(it => { if (usableWrong(it)) (pools[it.type] = pools[it.type] || []).push(it.correct); });
  items.forEach(it => { it.pool = pools[it.type] || []; it.poolAll = items.filter(usableWrong).map(o => o.correct); });
  return items.sort((a,b) => a.n - b.n);
}
const NOT_ORIGINAL_13 = ['Texas','California','Florida','Ohio','Vermont','Maine','Kentucky','Tennessee','Louisiana','Michigan','Illinois','Alabama'];

function specialWrong(it){

  if (/borders mexico/i.test(it.q)) return ['Florida','Nevada','Oklahoma','Louisiana','Utah','Colorado','Georgia'];
  if (/capital of your state/i.test(it.q)) return ['Houston','Dallas','Los Angeles','Miami','Chicago','New York City','Seattle','Las Vegas'];
  if (/main rival during the cold war/i.test(it.q)) return ['Canada','Mexico','Great Britain','France','Australia','Brazil'];
  if (/who did the united states fight in world war ii/i.test(it.q)) return ['Great Britain, France, and Canada','Mexico, Canada, and Cuba','Spain, Portugal, and Brazil','Australia, India, and China'];
  return null;
}
// ---- Wrong options must never be an accepted answer, even when written a bit differently ----
// "The Civil War" = "Civil War", "(U.S.) Constitution" = "Constitution", "Freedom of religion" contains "Religion"…
function normAns(s){
  return String(s).toLowerCase().replace(/\([^)]*\)/g, ' ').replace(/u\.s\./g, 'us').replace(/[’'".,;:!?]/g, '')
    .replace(/[\/-]/g, ' ').replace(/\b(the|a|an|of|from|in)\b/g, ' ').replace(/\s+/g, ' ').trim();
}
function acceptedForms(it){
  if (it._acc) return it._acc;
  const out = new Set();
  const add = x => { const n = normAns(x); if (n) out.add(n); };
  it.all.forEach(seg => {
    add(seg); add(cleanAns(seg));
    const afterColon = seg.includes(':') ? seg.split(':').slice(1).join(':') : seg;

  return (it._acc = [...out]);
}
// Hand-checked: answers to OTHER questions that mean the same as an accepted answer here
// (different words, same idea), so they must never be shown as a wrong option for that question.
const NOT_AS_WRONG = {
  '100': {
    48: ['At age eighteen (18)', 'Vote in a federal election'], 49: ['Citizens eighteen (18) and older can vote'], 50: ['Citizens eighteen (18) and older can vote'],
    51: ['You can practice any religion, or not practice a religion'], 54: ['At age eighteen (18)'],
    57: ['Eighteen (18) and older', 'Citizens eighteen (18) and older can vote'], 58: ['You can practice any religion, or not practice a religion']
  },
  '128': {
    3: ['The basic rights of Americans / of people living in the United States'],
    31: ['Citizens eighteen (18) and older can vote'], 32: ['Citizens eighteen (18) and older can vote'], 33: ['Citizens eighteen (18) and older can vote'], 34: ['Citizens eighteen (18) and older can vote'], 8: ['The basic rights of Americans / of people living in the United States'],
    10: ['The basic rights of Americans / of people living in the United States'], 37: ['So one part does not become too powerful'],
    70: ['Everyone must follow the law'], 71: ['Everyone must follow the law'], 72: ['Everyone must follow the law'],
    85: ['Writer of the Declaration of Independence'], 87: ['The Vice President (of the United States)'],
    112: ['Fought for civil rights'], 113: ['Fought to end racial discrimination'],
    127: ['A holiday to honor people in the (U.S.) military'], 128: ['A holiday to honor soldiers who died in military service']
  }
};
function wraps(a, b){ return (' ' + a + ' ').includes(' ' + b + ' '); }
function looksAccepted(it, cand){
  const n = normAns(cand); if (!n) return true;
  const block = (NOT_AS_WRONG[it.test] || {})[it.n];
  if (block && block.some(b => normAns(b) === n)) return true;
  return acceptedForms(it).some(acc => n === acc || (n.length >= 4 && acc.length >= 4 && (wraps(n, acc) || wraps(acc, n))));
}
// Every wrong option this question could ever show (same type first, then any other answer).
function civCandidates(it){
  if (it._cand) return it._cand;
  const out = [], seen = new Set();
  const special = specialWrong(it);
  const src = special || it.pool.concat(it.poolAll);
  for (const s of src) {
    const n = normAns(s);
    if (!n || seen.has(n) || s.length > 90 || looksAccepted(it, s)) continue;
    seen.add(n); out.push({text:s, same: !!special || it.pool.includes(s)});
  }
  return (it._cand = out);
}
function civOptions(it){
  const cands = civCandidates(it);
  if (it.multi) {
    const corr = shuffle(it.correctSet).slice(0, Math.min(it.correctSet.length, it.k + 1));
    const nWrong = Math.max(2, 6 - corr.length);
    const wrong = shuffle(cands).slice(0, nWrong).map(c => c.text);
    return shuffle(corr.map(s => ({text:s, ok:true})).concat(wrong.map(s => ({text:s, ok:false}))));
  }
  if (it.listItems) it.correct = it.listItems[Math.floor(Math.random() * it.listItems.length)];
  // Prefer wrong answers of the same type and a similar length, so the right one does not stand out.
  const L = it.correct.length;
  const pickFrom = list => shuffle(list).sort((a,b) => Math.abs(a.text.length - L) - Math.abs(b.text.length - L)).slice(0, 8);
  let pool = pickFrom(cands.filter(c => c.same));
  if (pool.length < 3) pool = pool.concat(pickFrom(cands.filter(c => !c.same)));
  const used = new Set(), pick = [];
  for (const c of shuffle(pool.slice(0, Math.max(3, Math.min(pool.length, 8))))) { if (pick.length >= 3) break; const n = normAns(c.text); if (used.has(n)) continue; used.add(n); pick.push(c.text); }
  for (const c of cands) { if (pick.length >= 3) break; const n = normAns(c.text); if (!used.has(n)) { used.add(n); pick.push(c.text); } }
  return shuffle([{text:it.correct, ok:true}].concat(pick.map(s => ({text:s, ok:false}))));
}
function civCat(test, n){
  const is128 = test === '128';
  if (n <= (is128 ? 72 : 57)) return t('catGov');
  if (n <= (is128 ? 116 : 87)) return t('catHist');
  return t('catCiv');
}
function civImage(test, n){
  const D = window.CIVICS_IMAGES; const keys = (D && D.map && D.map[test] && D.map[test][n]) || [];
  return keys.map(k => ({src:'/img/civics/' + k + '.webp', label:(D.labels && D.labels[k]) ? D.labels[k][lang === 'es' ? 1 : 0] : ''}));
}

function defItems(){ return DEFS.map((d,i) => ({kind:'mc', world:'def', id:'d-'+i, d})); }
function defOptions(it){
  const d = it.d;
  const others = shuffle(DEFS.filter(x => x !== d && !(d.group && x.group === d.group) && x.short.en.toLowerCase() !== d.short.en.toLowerCase())).slice(0,3);
  return shuffle([{text:d.short.en, sub:d.short.es, ok:true}].concat(others.map(x => ({text:x.short.en, sub:x.short.es, ok:false}))));
}
// "Guess the word": the short definition is the question and the student picks the term.
// Distractors: up to 2 words from the same theme (look alike) + others from the rest; never a word with the same meaning.
function revItems(){ return DEFS.map((d,i) => ({kind:'mc', world:'rev', id:'r-'+i, d})); }
function revOptions(it){
  const d = it.d, same = x => x.short.en.toLowerCase() === d.short.en.toLowerCase() || x.term.toLowerCase() === d.term.toLowerCase();
  const near = shuffle(DEFS.filter(x => x !== d && d.group && x.group === d.group && !same(x))).slice(0, 2);
  const far = shuffle(DEFS.filter(x => x !== d && !near.includes(x) && !same(x) && !(d.group && x.group === d.group))).slice(0, 3 - near.length);
  return shuffle([{text:d.term, ok:true}].concat(near.concat(far).map(x => ({text:x.term, ok:false}))));
}
function wriItems(){ return SENTENCES.map((s,i) => ({kind:'write', world:'wri', id:'w-'+i, s})); }

// Writing grader (same rules as writing.html: small typos allowed, capitals checked)
function normalize(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[.,!?;:'"-]/g,'').replace(/\s+/g,' ').trim(); }
function lev(a,b){ const m=a.length,n=b.length; const dp=Array.from({length:m+1},(_,i)=>[i].concat(Array(n).fill(0))); for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]); return dp[m][n]; }
function wordsMatch(tw, cw){ if (tw === cw) return true; const L = cw.length, tol = L<=3 ? 0 : (L<=6 ? 1 : 2); return lev(tw,cw) <= tol; }
function caseWords(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[.,!?;:'"-]/g,'').replace(/\s+/g,' ').trim().split(' ').filter(Boolean); }
function gradeSentence(typed, correct){
  const tw = normalize(typed).split(' ').filter(Boolean), cw = normalize(correct).split(' ').filter(Boolean);
  const badIdx = [];
  if (tw.length !== cw.length) { cw.forEach((w,i) => { if (!tw[i] || !wordsMatch(tw[i], w)) badIdx.push(i); }); return {result:'wrong', badIdx, caseIdx:[]}; }
  cw.forEach((w,i) => { if (!wordsMatch(tw[i], w)) badIdx.push(i); });
  if (badIdx.length) return {result:'wrong', badIdx, caseIdx:[]};
  const tc = caseWords(typed), cc = caseWords(correct), caseIdx = [];
  if (tc.length === cc.length) cc.forEach((w,i) => { const a = tc[i].charAt(0), b = w.charAt(0); if (a !== b && a.toLowerCase() === b.toLowerCase()) caseIdx.push(i); });
  return {result: caseIdx.length ? 'case' : 'ok', badIdx:[], caseIdx};
}
function markSentence(sentence, idxs, cls){
  return sentence.split(/\s+/).map((w,i) => idxs.includes(i) ? '<span class="'+cls+'">'+esc(w)+'</span>' : esc(w)).join(' ');
}

    const multi = !!it.multi;
    if (multi) html += '<div class="pickhint"><span>☑️ ' + esc(t('pickAtLeast')(it.k)) + '</span><span>' + esc(t('picked')(R.sel.size, it.k)) + '</span></div>';
    html += '<div class="choices"' + (multi ? ' role="group"' : '') + '>' + R.opts.map((o,i) => {
      let cls = multi ? 'multi' : '', tag = '';
      if (R.phase === 'fb') {
        if (multi) { const sel = R.sel.has(i); cls += o.ok ? (sel ? ' right' : ' also') : (sel ? ' wrong' : ' dim'); if (o.ok && !sel) tag = '<span class="tag">' + esc(t('alsoRight')) + '</span>'; }
        else cls += o.ok ? ' right' : (i === R.chosen ? ' wrong' : ' dim');
      } else if (multi && R.sel.has(i)) cls += ' sel';
      return '<button class="choice ' + cls + '" type="button" ' + (R.phase === 'fb' ? 'disabled' : 'onclick="choose(' + i + ')"') + (multi ? ' aria-pressed="' + R.sel.has(i) + '"' : '') + '><span class="k">' + (multi && R.phase === 'ask' && R.sel.has(i) ? '✓' : (i+1)) + '</span><span lang="en">' + esc(o.text) +
        (o.sub && lang === 'es' ? '<small lang="es">' + esc(o.sub) + '</small>' : '') + tag + '</span></button>';
    }).join('') + '</div>';
    if (multi && R.phase === 'ask') html += '<div class="actions"><button class="btn green block" type="button" onclick="checkMulti()"' + (R.sel.size < it.k ? ' disabled' : '') + '>' + esc(t('check')) + '</button></div>';
  } else {
    const cls = R.phase === 'fb' ? (R.fb.kind === 'bad' ? 'bad' : 'ok') : '';
    html += '<div class="qkind">✍️ ' + esc(t('kWri')) + ' ' + again + '</div><div class="qtext">' + esc(t('writeAsk')) + '</div>' +
      '<button class="listen-big" type="button" onclick="speak(R.cur.s, 0.85)">' + esc(t('listenBig')) + '</button>' +
      '<input class="write-in ' + cls + '" id="wIn" type="text" lang="en" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + esc(t('writeHere')) + '" value="' + esc(R.typed) + '"' + (R.phase === 'fb' ? ' disabled' : '') + '>' +
      (R.phase === 'ask' ? '<div class="actions"><button class="btn green block" type="button" onclick="checkWrite()">' + esc(t('check')) + '</button></div>' : '');
  }
  if (R.phase === 'fb') html += feedbackHtml() + '<div class="actions"><button class="btn block ' + (R.fb.kind === 'bad' ? '' : 'green') + '" type="button" id="contBtn" onclick="cont()">' + esc(t('cont')) + '</button></div>';
  html += '</div><div class="kbd-hint">' + esc(t('hintKeys')) + '</div></div>';
  app.innerHTML = html;
  if (it.kind === 'write' && R.phase === 'ask') {
    const inp = document.getElementById('wIn');
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkWrite(); } });
    inp.addEventListener('input', e => { R.typed = e.target.value; });
    setTimeout(() => { try { inp.focus({preventScroll:true}); } catch(e){} }, 30);
  }
  if (R.phase === 'fb') { const b = document.getElementById('contBtn'); if (b) setTimeout(() => { try { b.focus({preventScroll:true}); } catch(e){} }, 30); }
}

function feedbackHtml(){
  const it = R.cur, f = R.fb;
  const head = f.kind === 'good' ? '<h3>✅ ' + esc(f.title) + ' <span class="xp">' + t('xpGain')(f.xp) + '</span></h3>'
             : f.kind === 'mid' ? '<h3>🟡 ' + esc(t('caseTitle')) + ' <span class="xp">' + t('xpGain')(f.xp) + '</span></h3>'
             : '<h3>❌ ' + esc(it.kind === 'write' ? t('writeWrong') : (it.multi ? t('multiWrong') : t('wrong'))) + '</h3>';
  let body = '';
  if (it.kind === 'mc' && it.world === 'civ') {
    const imgs = civImage(it.test, it.n);
    body += '<div class="lbl">' + esc(t('accepted')) + '</div><ul lang="en">' + it.all.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>';
    if (it.two) body += '<div>' + esc(t('twoNote')) + '</div>';
    if (imgs.length) body += '<div class="imgrow">' + imgs.slice(0,2).map(im => '<img src="' + esc(im.src) + '" alt="' + esc(im.label) + '" loading="lazy" onerror="this.remove()">').join('') + '</div>';
  } else if (it.kind === 'mc' && it.world === 'rev') {
    const d = it.d;
    body += '<div class="lbl">' + esc(t('theWord')) + '</div><div class="say" lang="en">' + esc(d.term) + '</div>' +
      (d.pron ? '<div><b>' + esc(t('pron')) + ':</b> ' + esc(d.pron) + '</div>' : '') +
      '<div class="lbl">' + esc(t('officialDef')) + '</div><div lang="en">' + esc(d.official.en) + '</div>' +
      (lang === 'es' && d.official.es ? '<div>' + esc(d.official.es) + '</div>' : '');
  } else if (it.kind === 'mc') {
    const d = it.d;
    body += '<div class="lbl">' + esc(t('sayIt')) + '</div><div class="say" lang="en">' + esc(d.short.en) + '</div>' +
      '<div class="lbl">' + esc(t('officialDef')) + '</div><div lang="en">' + esc(d.official.en) + '</div>' +
      (lang === 'es' && d.official.es ? '<div>' + esc(d.official.es) + '</div>' : '') +
      (d.pron ? '<div><b>' + esc(t('pron')) + ':</b> ' + esc(d.pron) + '</div>' : '');
  } else {
    if (f.kind === 'bad') body += '<div class="sent" lang="en">' + markSentence(it.s, f.badIdx, 'w-bad') + '</div><div class="lbl">' + esc(t('yourAnswer')) + '</div><div lang="en">' + esc(R.typed) + '</div>';
    else if (f.kind === 'mid') body += '<div class="sent" lang="en">' + markSentence(it.s, f.caseIdx, 'w-case') + '</div><div>' + esc(t('caseNote')) + '</div>';
    else body += '<div class="sent" lang="en">' + esc(it.s) + '</div>';
  }
  if (f.kind === 'bad') body += '<div><b>' + esc(t('comesBack')) + '</b></div>';
  return '<div class="fb ' + f.kind + '">' + head + body + '</div>';
}

function award(firstTry){
  let xp = firstTry ? 10 : 5;
  R.combo++; R.best = Math.max(R.best, R.combo);
  if (R.combo >= 3) xp += 5;
  R.xp += xp; return xp;
}
function miss(){
  R.hearts--; R.combo = 0;
  const it = R.cur;
  if (!R.missedIds.has(it.id)) { R.missedIds.add(it.id); R.missed.push(it); }
  R.retries.add(it.id); R.queue.push(it);
}
function choose(i){
  if (R.phase !== 'ask') return;
  if (R.cur.multi) { if (R.sel.has(i)) R.sel.delete(i); else R.sel.add(i); SFX.tap(); render(); return; }
  const o = R.opts[i], it = R.cur; R.chosen = i;
  const firstTry = !R.missedIds.has(it.id);
  if (o.ok) {
    const xp = award(firstTry); if (firstTry) R.firstOk++; R.done++;
    const r = t('right'); R.fb = {kind:'good', xp, title:r[(Math.random()*r.length)|0]};
    (R.combo >= 3 && R.combo % 3 === 0) ? SFX.combo() : SFX.ok();
  } else { miss(); R.fb = {kind:'bad'}; SFX.bad(); }
  R.phase = 'fb'; render();
  if (!o.ok) { const q = document.getElementById('qcard'); if (q) q.classList.add('shake'); }
  speak(it.world === 'civ' ? it.correct : it.world === 'rev' ? it.d.term : it.d.short.en);
}
function checkMulti(){
  if (R.phase !== 'ask' || !R.cur.multi) return;
  const it = R.cur;
  if (R.sel.size < it.k) return;
  const allRight = [...R.sel].every(i => R.opts[i].ok);
  const firstTry = !R.missedIds.has(it.id);
  if (allRight) {
    const xp = award(firstTry); if (firstTry) R.firstOk++; R.done++;
    const r = t('right'); R.fb = {kind:'good', xp, title:r[(Math.random()*r.length)|0]};
    (R.combo >= 3 && R.combo % 3 === 0) ? SFX.combo() : SFX.ok();
  } else { miss(); R.fb = {kind:'bad'}; SFX.bad(); }
  R.phase = 'fb'; render();
  if (!allRight) { const q = document.getElementById('qcard'); if (q) q.classList.add('shake'); }
  speak(it.correctSet.slice(0, it.k).join(', '));
}
function checkWrite(){
  if (R.phase !== 'ask') return;
  const inp = document.getElementById('wIn'); R.typed = inp ? inp.value : R.typed;
  if (!R.typed.trim()) { if (inp) inp.focus(); return; }
  const it = R.cur, g = gradeSentence(R.typed, it.s), firstTry = !R.missedIds.has(it.id);
  if (g.result === 'wrong') { miss(); R.fb = {kind:'bad', badIdx:g.badIdx}; SFX.bad(); }
  else {
    if (firstTry) R.firstOk++; R.done++;
    if (g.result === 'case') { R.combo = 0; const xp = firstTry ? 5 : 3; R.xp += xp; R.fb = {kind:'mid', xp, caseIdx:g.caseIdx}; SFX.ok(); }
    else { const xp = award(firstTry); const r = t('right'); R.fb = {kind:'good', xp, title:r[(Math.random()*r.length)|0]}; (R.combo >= 3 && R.combo % 3 === 0) ? SFX.combo() : SFX.ok(); }
  }
  R.phase = 'fb'; render();
  if (g.result === 'wrong') { const q = document.getElementById('qcard'); if (q) q.classList.add('shake'); }
}
function cont(){
  if (R.phase !== 'fb') return;
  stopSpeak();
  if (R.hearts <= 0) return finishRound(false);
  nextQ();
  if (!R.cur) return finishRound(true);
  render();
  if (R.cur.kind === 'write') speak(R.cur.s, 0.85);
}
function quitRound(){
  if (!quitArmed) { quitArmed = true; render(); setTimeout(() => { if (quitArmed) { quitArmed = false; if (screen === 'play') render(); } }, 3500); return; }
  quitArmed = false; R = null; goMap();
}

let lastResult = null;
function finishRound(won){
  const before = lvlInfo(G.xp).n;
  let stars = 0;
  if (won) { const acc = R.firstOk / R.total; stars = acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : 1; }
  const bonus = won ? 20 * stars : 0;
  G.xp += R.xp + bonus;
  if (won && R.levelIdx >= 0) { const k = progKey(R.w) + '-' + R.levelIdx; G.stars[k] = Math.max(G.stars[k] || 0, stars); }
  touchStreak();
  const mNow = masteredWorlds().length, newMastery = mNow > (G.masteredSeen || 0);
  if (newMastery) G.masteredSeen = mNow;
  saveG();
  lastResult = { newMastery, won, stars, xp: R.xp + bonus, firstOk: R.firstOk, total: R.total, best: R.best, missed: R.missed.slice(), w: R.w, levelIdx: R.levelIdx, nLevels: R.nLevels, levelUp: lvlInfo(G.xp).n > before ? lvlInfo(G.xp).n : 0 };
  saveSession(R.total, R.firstOk);
  screen = 'result'; render(); window.scrollTo({top:0});
  if (won) { SFX.win(); if (stars >= 2) confetti(); } else SFX.lose();
}
function missedLabel(it){
  if (it.kind === 'write') return {q: it.s, a: ''};
  if (it.world === 'civ') return {q: it.q, a: it.correct};
  if (it.world === 'rev') return {q: it.d.short.en, a: it.d.term};
  return {q: it.d.term, a: it.d.short.en};
}
function renderResult(){
  const r = lastResult;
  const title = r.won ? t('winTitle')[Math.max(0, r.stars - 1)] : t('loseTitle');
  const stars = '<div class="bigstars" aria-label="' + r.stars + ' / 3">' + [0,1,2].map(i => '<span class="' + (i < r.stars ? 'on' : '') + '">★</span>').join('') + '</div>';
  const hasNext = r.won && r.levelIdx >= 0 && r.levelIdx + 1 < r.nLevels;
  let html = '<div class="narrow"><div class="result">' + (r.won ? stars : '<div class="bigstars">💔</div>') + '<h2>' + esc(title) + '</h2>' +
    (r.won ? '' : '<p style="margin-top:8px;font-weight:700;color:var(--muted)">' + esc(t('loseSub')) + '</p>') +
    (r.levelUp ? '<div class="levelup">' + t('levelUp')(r.levelUp) + '</div>' : '') +
    '<div class="rgrid"><div><b>' + r.firstOk + '/' + r.total + '</b><span>' + esc(t('rFirst')) + '</span></div><div><b>🔥 ' + r.best + '</b><span>' + esc(t('rCombo')) + '</span></div><div><b>+' + r.xp + '</b><span>' + esc(t('rXp')) + '</span></div></div>' +
    '<div class="rbtns">' +
      (hasNext ? '<button class="btn gold block" type="button" onclick="startRound(lastResult.w, lastResult.levelIdx + 1)">' + esc(t('nextLevel')) + '</button>' : '') +
      '<button class="btn ' + (hasNext ? 'ghost' : 'gold') + ' block" type="button" onclick="startRound(lastResult.w, lastResult.levelIdx)">' + esc(t('retry')) + '</button>' +
      '<button class="btn ghost block" type="button" onclick="goMap()">' + esc(t('toMap')) + '</button></div>';
  if (r.newMastery) html += nudgeHtml(true);
  if (r.missed.length) html += '<div class="missed"><h4>' + esc(t('missedTitle')) + '</h4><ul>' + r.missed.slice(0,10).map(it => { const m = missedLabel(it); return '<li lang="en">' + esc(m.q) + (m.a ? '<small>' + esc(m.a) + '</small>' : '') + '</li>'; }).join('') + '</ul></div>';
  html += '</div></div>';
  app.innerHTML = html;
}

// ===================== Keyboard =====================
document.addEventListener('keydown', e => {
  if (screen !== 'play' || !R || !R.cur || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && e.target.id === 'wIn') return;
  if (R.phase === 'ask' && R.cur.kind === 'mc' && /^[1-9]$/.test(e.key)) { const i = +e.key - 1; if (R.opts[i]) choose(i); }
  else if (R.phase === 'ask' && R.cur.multi && e.key === 'Enter') { e.preventDefault(); checkMulti(); }
  else if (R.phase === 'fb' && e.key === 'Enter') { e.preventDefault(); cont(); }
});

// ===================== Settings =====================
function setLang(l){ lang = l; try { localStorage.setItem('lang', l); } catch(e){} render(); }
document.getElementById('langEs').onclick = () => setLang('es');
document.getElementById('langEn').onclick = () => setLang('en');
document.getElementById('soundBtn').onclick = () => { G.sound = !G.sound; try { localStorage.setItem('game.sound', G.sound ? '1' : '0'); } catch(e){} paintTop(); SFX.tap(); };

// ===================== Stats (same table as the other practice pages) =====================
async function saveSession(questions, correct){
  try {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) return;
    const score = questions > 0 ? Math.round(correct / questions * 100) : null;
    await supabaseClient.from('practice_sessions').insert({ user_id: user.id, mode: 'game', questions, correct, score });
  } catch(e){ console.log('saveSession skipped:', e); }
}

// ===================== Init =====================
async function init(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }
  uid = (session.user && session.user.id) || 'anon';
  // Premium only (same check as live-interview.html): anyone else goes back to the Hub, where the upgrade is offered.
  let isPremium = false;
  try {
    const { data: profile } = await supabaseClient.from('profiles').select('plan, plan_expires_at, live_credits').eq('id', uid).single();
    const notExpired = profile && (!profile.plan_expires_at || new Date(profile.plan_expires_at) > new Date());
    isPremium = !!(profile && profile.plan === 'premium' && notExpired);
    if (profile) { liveCredits = typeof profile.live_credits === 'number' ? profile.live_credits : 0; premiumUntil = profile.plan_expires_at ? new Date(profile.plan_expires_at).getTime() : null; }
  } catch(e){ isPremium = false; }
  if (!isPremium) { window.location.href = 'dashboard.html'; return; }
  const md = (session.user && session.user.user_metadata) || {};
  userName = (md.full_name || md.name || '').split(' ')[0] || (session.user.email || '').split('@')[0];
  G = loadG();
  render();
  // Load the civics bank in the background so level counts (and mastery) are exact; then refresh the home screen.
  loadCivics(G.test, G.state).then(() => { if (screen === 'home') render(); }).catch(() => {});
  document.getElementById('loadingOverlay').classList.add('hidden');
}
init();
</script>
