<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civics Practice - Immigration Interviews</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #f8fafc; color: #0f172a; line-height: 1.6; }

        .loading-overlay { position: fixed; inset: 0; background: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; z-index: 5000; }
        .loading-overlay.hidden { display: none; }
        .spinner { width: 44px; height: 44px; border: 4px solid #e2e8f0; border-top-color: #1e40af; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay p { color: #64748b; font-weight: 500; }

        .topbar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0.875rem 0; position: sticky; top: 0; z-index: 1000; }
        .topbar-inner { max-width: 800px; margin: 0 auto; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.2rem; font-weight: 800; color: #0f172a; text-decoration: none; display: flex; align-items: center; gap: 0.4rem; }
        .top-actions { display: flex; align-items: center; gap: 0.75rem; }
        .lang-toggle { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 2rem; padding: 0.3rem; display: flex; gap: 0.15rem; }
        .lang-toggle button { border: none; background: transparent; padding: 0.25rem 0.7rem; border-radius: 2rem; font-weight: 700; font-size: 0.8rem; cursor: pointer; color: #64748b; font-family: inherit; }
        .lang-toggle button.on { background: #1e40af; color: white; }
        .btn-back { background: white; color: #475569; border: 1px solid #e2e8f0; padding: 0.45rem 0.9rem; border-radius: 0.5rem; font-weight: 600; font-size: 0.85rem; cursor: pointer; text-decoration: none; }
        .btn-back:hover { border-color: #cbd5e1; }

        .wrap { max-width: 800px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
        h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.25rem; }
        .sub { color: #64748b; margin-bottom: 2rem; }

        .field { margin-bottom: 1.75rem; }
        .field-label { font-weight: 700; color: #334155; margin-bottom: 0.75rem; }
        .opts { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .opt { background: white; color: #475569; border: 2px solid #e2e8f0; padding: 0.7rem 1.1rem; border-radius: 0.6rem; font-weight: 600; font-size: 0.9rem; cursor: pointer; font-family: inherit; transition: all 0.15s; line-height: 1.2; }
        .opt:hover { border-color: #cbd5e1; }
        .opt.sel { border-color: #1e40af; background: #eff6ff; color: #1e40af; }
        .opt small { display: block; font-weight: 500; opacity: 0.7; font-size: 0.72rem; }

        .btn-primary { background: #1e40af; color: white; border: none; padding: 1rem 2rem; border-radius: 0.7rem; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .btn-primary:hover { background: #1e3a8a; transform: translateY(-1px); }
        .btn-ghost { background: white; color: #1e40af; border: 2px solid #1e40af; padding: 0.85rem 1.5rem; border-radius: 0.7rem; font-weight: 700; cursor: pointer; font-family: inherit; }
        .btn-ghost:hover { background: #eff6ff; }

        .note { color: #94a3b8; font-size: 0.85rem; margin-top: 1.5rem; }

        /* Study card */
        .progress { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
        .btn-exit { background: white; color: #64748b; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.4rem 0.8rem; font-weight: 600; font-size: 0.8rem; cursor: pointer; font-family: inherit; white-space: nowrap; }
        .btn-exit:hover { border-color: #dc2626; color: #dc2626; }
        .progress-bar { flex: 1; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: #1e40af; transition: width 0.3s; }
        .progress-text { font-size: 0.85rem; color: #64748b; font-weight: 600; white-space: nowrap; }

        .card { background: white; border: 1px solid #e2e8f0; border-radius: 1.25rem; padding: 2.5rem 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
        .q-num { font-size: 0.8rem; font-weight: 700; color: #1e40af; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
        .q-text { font-size: 1.5rem; font-weight: 700; line-height: 1.35; margin-bottom: 1.5rem; }
        .btn-speak { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; border-radius: 0.5rem; padding: 0.1rem 0.5rem; font-size: 0.95rem; cursor: pointer; vertical-align: middle; line-height: 1.4; }
        .btn-speak:hover { background: #dbeafe; }
        .state-select { width: 100%; max-width: 380px; padding: 0.7rem 0.9rem; border: 2px solid #e2e8f0; border-radius: 0.6rem; font-family: inherit; font-size: 0.95rem; font-weight: 600; color: #334155; background: white; cursor: pointer; }
        .state-select:focus { outline: none; border-color: #1e40af; }
        .answer { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 0.75rem; padding: 1.25rem; margin-bottom: 1.5rem; display: none; }
        .answer.show { display: block; }
        .answer .lbl { font-size: 0.75rem; font-weight: 700; color: #16a34a; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.4rem; }
        .answer .txt { font-size: 1.1rem; color: #166534; font-weight: 600; }
        .card-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .card-actions button { flex: 1; min-width: 130px; }
        .btn-known { background: #16a34a; color: white; border: none; padding: 0.9rem; border-radius: 0.6rem; font-weight: 700; cursor: pointer; font-family: inherit; }
        .btn-known:hover { background: #15803d; }
        .btn-miss { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; padding: 0.9rem; border-radius: 0.6rem; font-weight: 700; cursor: pointer; font-family: inherit; }
        .btn-miss:hover { background: #ffedd5; }

        /* Results */
        .result-card { background: white; border: 1px solid #e2e8f0; border-radius: 1.25rem; padding: 2.5rem 2rem; text-align: center; }
        .result-emoji { font-size: 3rem; margin-bottom: 0.5rem; }
        .result-score { font-size: 2.5rem; font-weight: 800; color: #1e40af; margin: 0.5rem 0; }
        .result-actions { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.75rem; }
    
        /* Repaso de hoy */
        .review-cta { background: #eff6ff; border: 2px solid #bfdbfe; border-radius: 1rem; padding: 1.25rem; margin-bottom: 1.75rem; display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .review-cta .rc-text { min-width: 0; flex: 1 1 220px; }
        .rc-title { font-weight: 800; font-size: 1.1rem; color: #1e3a8a; }
        .rc-sub { color: #475569; font-size: 0.88rem; margin-top: 0.15rem; }
        .rc-hint { color: #64748b; font-size: 0.8rem; margin-top: 0.35rem; }
        .review-cta .btn-primary { padding: 0.8rem 1.4rem; font-size: 1rem; }
        .review-cta .btn-primary:disabled, .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .review-cta.done { background: #f0fdf4; border-color: #bbf7d0; }
        .review-cta.done .rc-title { color: #166534; }
        .rc-steps { margin: 0.6rem 0 0 1.15rem; padding: 0; color: #334155; font-size: 0.88rem; }
        .rc-steps li { margin-bottom: 0.2rem; }
        .review-cta .btn-ghost { padding: 0.75rem 1.2rem; font-size: 0.95rem; white-space: nowrap; }
        .think { background: #eff6ff; color: #1e40af; border-radius: 0.75rem; padding: 0.9rem 1rem; font-weight: 600; margin-bottom: 1.25rem; }
        .btn-known small, .btn-miss small { display: block; font-weight: 500; font-size: 0.72rem; opacity: 0.85; }
        .rv-sum { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; margin-top: 1.25rem; text-align: center; }
        .rv-sum div { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem; }
        .rv-sum b { display: block; font-size: 1.5rem; color: #1e40af; }
        .rv-sum span { font-size: 0.78rem; color: #64748b; }
        .rv-note { color: #64748b; margin-top: 1rem; font-size: 0.95rem; }

        .brand-logo { height: 104px; width: 104px; object-fit: contain; vertical-align: middle; margin-right: 0.45rem; }
        @media (max-width: 600px) { .brand-logo { height: 56px; width: 56px; } .logo { font-size: 1.15rem; } }
            .brand-text { white-space: nowrap; line-height: 1.1; }
        /* Mobile: wordmark en texto (nítido a dos líneas); el sello solo en pantallas grandes */
        @media (max-width: 600px) {
            .topbar-inner { padding: 0 1rem; }
            .brand-logo { height: 52px; width: 52px; margin-right: 0.4rem; }
            .brand-text { display: inline-block; white-space: normal; width: min-content; font-size: 1.05rem; font-weight: 800; line-height: 1.15; }
        }
    </style>
</head>

    <div class="topbar">

            <a href="dashboard.html" class="logo"><img src="immigrationinterviews_logo.png" alt="Immigration Interviews" class="brand-logo"><span style="display:flex; flex-direction:column; line-height:1.15;"><span class="brand-text">Immigration <span style="color:#dc2626;">Interviews</span></span><span style="font-size:0.8rem; font-weight:700; color:#475569; letter-spacing:.01em;">immigrationinterviews.com</span></span></a>

        </div>

    <div class="wrap" id="app"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/tts.js"></script>
    <script>
        // ---------- Supabase (auth guard) ----------
        const SUPABASE_URL = 'https://vugvnqapdxyewxyfaayl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_vFFY4GL2f8PIGrArW05ncg_PVkcgV4M';
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ---------- Translations (UI only — the questions stay in English) ----------
        const T = {
            en: {
                back: '← Hub',
                exit: '✕ Exit',
                title: 'Civics Practice',
                sub: 'Study the official USCIS civics questions at your own pace.',
                whichTest: 'Which test are you studying for?',
                t100: '100 Questions', t100s: '2008 test',
                t128: '128 Questions', t128s: '2025 test',
                topic: 'Topic', allTopics: 'All topics',
                stateLabel: 'Your state (for state-specific questions)', stateNone: 'Not listed / choose later',
                howMany: 'How many questions?', all: 'All',
                start: 'Start studying →',
                loading: 'Loading questions…',
                noteEng: 'Questions and answers are shown in English, just like the real test.',
                show: 'Show answer',
                official: 'Official accepted answer(s)',
                known: 'I knew it', miss: 'Need to review',
                qof: (i, n) => `Question ${i} of ${n}`,
                done: 'Session complete!',
                score: (k, n) => `You knew ${k} of ${n}`,
                again: 'Practice again',
                redoMissed: 'Review the ones I missed',
                toHub: 'Back to hub',
                catGov: 'American Government', catHist: 'American History', catCivics: 'Integrated Civics',
                revTitle: 'Review of the day',
                revSub: (d, f) => (d ? d + ' to review' : '') + (d && f ? ' + ' : '') + (f ? f + ' new' : ''),
                revNone: 'Nothing to review today. Come back tomorrow.',
                revMastered: (k, n) => k + ' of ' + n + ' mastered',
                revHint: 'Say each answer out loud before you see it. The ones you miss come back soon; the ones you know take longer to return. Up to 10 questions a day. To practice more, use the options below.',
                revStart: n => 'Start review (' + n + ')',
                revLoading: 'Loading review…',
                revThink: '🎤 Think of your answer and say it out loud.',
                revShow: 'Show answer',
                revKnown: 'I said it right', revKnownSub: 'moves up a level',
                revMiss: 'I did not know it', revMissSub: 'comes back in a few cards',
                revLeft: n => n + ' left',
                revNewTag: 'New', revAgainTag: 'Again',
                lv1: 'Hard', lv2: 'Learning', lv3: 'Improving', lv4: 'Almost there', lv5: 'Mastered',
                revDoneTitle: 'Review complete!',
                revFirstTry: 'Said right the first time', revToMorrow: 'To review tomorrow',
                revTomorrow: n => n ? 'Tomorrow you will review ' + n + (n === 1 ? ' question.' : ' questions.') : 'No reviews scheduled for tomorrow yet.',
                revBack: 'Back to civics',
                revSteps: ['Read the question and say your answer out loud.', 'Tap Show answer and compare it with yours.', 'Mark whether you got it right. The ones you miss come back soon; the ones you know take longer to return.'],
                revLimit: 'Up to 10 questions a day. To practice more, use the options below.',
                revDoneToday: '✓ Done for today!',
                revMoreHint: 'Want to keep going? Practice more below. That does not change your review schedule.',
                revMore: 'Practice more now'
            },
            es: {
                back: '← Inicio',
                exit: '✕ Salir',
                title: 'Práctica de Civismo',
                sub: 'Estudia las preguntas oficiales de civismo de USCIS a tu ritmo.',
                whichTest: '¿Para cuál examen estás estudiando?',
                t100: '100 Preguntas', t100s: 'examen 2008',
                t128: '128 Preguntas', t128s: 'examen 2025',
                topic: 'Tema', allTopics: 'Todos los temas',
                stateLabel: 'Tu estado (para preguntas que dependen del estado)', stateNone: 'No está en la lista / elegir después',
                howMany: '¿Cuántas preguntas?', all: 'Todas',
                start: 'Empezar a estudiar →',
                loading: 'Cargando preguntas…',
                noteEng: 'Las preguntas y respuestas se muestran en inglés, igual que en el examen real.',
                show: 'Ver respuesta',
                official: 'Respuesta(s) oficial(es) aceptada(s)',
                known: 'La sabía', miss: 'Repasar',
                qof: (i, n) => `Pregunta ${i} de ${n}`,
                done: '¡Sesión completa!',
                score: (k, n) => `Supiste ${k} de ${n}`,
                again: 'Practicar de nuevo',
                redoMissed: 'Repasar las que fallé',
                toHub: 'Volver al inicio',
                catGov: 'Gobierno de EE. UU.', catHist: 'Historia de EE. UU.', catCivics: 'Civismo Integrado',
                revTitle: 'Repaso de hoy',
                revSub: (d, f) => (d ? d + (d === 1 ? ' para repasar' : ' para repasar') : '') + (d && f ? ' + ' : '') + (f ? f + (f === 1 ? ' nueva' : ' nuevas') : ''),
                revNone: 'Nada para repasar hoy. Vuelve mañana.',
                revMastered: (k, n) => k + ' de ' + n + ' dominadas',
                revHint: 'Di cada respuesta en voz alta antes de verla. Las que falles vuelven pronto; las que sabes tardan más en volver. Hasta 10 preguntas al día. Para practicar más, usa las opciones de abajo.',
                revStart: n => 'Empezar repaso (' + n + ')',
                revLoading: 'Cargando repaso…',
                revThink: '🎤 Piensa tu respuesta y dila en voz alta.',
                revShow: 'Mostrar respuesta',
                revKnown: 'La dije bien', revKnownSub: 'sube un escalón',
                revMiss: 'No la sabía', revMissSub: 'vuelve en unas tarjetas',
                revLeft: n => 'Quedan ' + n,
                revNewTag: 'Nueva', revAgainTag: 'Otra vez',
                lv1: 'Difícil', lv2: 'Aprendiendo', lv3: 'Mejorando', lv4: 'Casi lista', lv5: 'Dominada',
                revDoneTitle: '¡Repaso completo!',
                revFirstTry: 'Las dijiste bien a la primera', revToMorrow: 'Para repasar mañana',
                revTomorrow: n => n ? 'Mañana te tocará repasar ' + n + (n === 1 ? ' pregunta.' : ' preguntas.') : 'Aún no tienes repasos programados para mañana.',
                revBack: 'Volver a civismo',
                revSteps: ['Lee la pregunta y di tu respuesta en voz alta.', 'Pulsa Mostrar respuesta y compárala con la tuya.', 'Marca si la dijiste bien o no. Las que falles vuelven pronto; las que sabes tardan más en volver.'],
                revLimit: 'Hasta 10 preguntas al día. Para practicar más, usa las opciones de abajo.',
                revDoneToday: '✓ ¡Listo por hoy!',
                revMoreHint: '¿Quieres seguir? Practica más abajo. Eso no cambia tu calendario de repaso.',
                revMore: 'Practicar más ahora'
            }
        };

        let lang = localStorage.getItem('lang') || 'en';
        function t(k) { return T[lang][k]; }

        // ---------- State ----------
        const state = {
            screen: 'setup',
            test: '100',
            category: 'all',
            count: 10,
            userState: '',          // selected state for state-specific answers
            bankCache: {},          // cached banks keyed by "test|state"
            working: [],
            index: 0,
            known: 0,
            missed: [],
            revealed: false
        };

        // Keep in sync with STATE_INFO in api/civics.js
        const STATE_NAMES = ['Alabama','Alaska','Arizona','Arkansas','California','Colorado','Connecticut','Delaware','Florida','Georgia','Hawaii','Idaho','Illinois','Indiana','Iowa','Kansas','Kentucky','Louisiana','Maine','Maryland','Massachusetts','Michigan','Minnesota','Mississippi','Missouri','Montana','Nebraska','Nevada','New Hampshire','New Jersey','New Mexico','New York','North Carolina','North Dakota','Ohio','Oklahoma','Oregon','Pennsylvania','Rhode Island','South Carolina','South Dakota','Tennessee','Texas','Utah','Vermont','Virginia','Washington','West Virginia','Wisconsin','Wyoming'];

        function categoriesFor(test) {
            const is128 = (test === '128');
            return [
                { key: 'gov',    label: t('catGov'),    min: 1,                 max: is128 ? 72 : 57 },
                { key: 'hist',   label: t('catHist'),   min: is128 ? 73 : 58,   max: is128 ? 116 : 87 },
                { key: 'civics', label: t('catCivics'), min: is128 ? 117 : 88,  max: is128 ? 128 : 100 }
            ];
        }

        // ---------- Language ----------
        function setLang(l) {
            lang = l;
            localStorage.setItem('lang', l);
            document.getElementById('langEn').classList.toggle('on', l === 'en');
            document.getElementById('langEs').classList.toggle('on', l === 'es');
            document.getElementById('backBtn').textContent = t('back');
            document.documentElement.lang = l;
            render();
        }

        // ---------- Data ----------
        async function loadBank(test, userState) {
            const key = test + '|' + (userState || '');
            if (state.bankCache[key]) return state.bankCache[key];
            const url = '/api/questions?v=' + test + (userState ? '&state=' + encodeURIComponent(userState) : '');
            const res = await fetch(url);
            const data = await res.json();
            state.bankCache[key] = data.questions;
            return data.questions;
        }

        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ---------- Render ----------
        const app = document.getElementById('app');

        function render() {
            if (state.screen === 'setup') renderSetup();
            else if (state.screen === 'study') renderStudy();
            else if (state.screen === 'results') renderResults();
            else if (state.screen === 'review') renderReview();
            else if (state.screen === 'reviewDone') renderReviewDone();
        }

        function renderSetup() {
            const cats = categoriesFor(state.test);
            const catBtns = [{ key: 'all', label: t('allTopics') }, ...cats]
                .map(c => `<button class="opt ${state.category === c.key ? 'sel' : ''}" onclick="pick('category','${c.key}')">${c.label}</button>`).join('');
            const counts = [10, 20, 'all'];
            const countBtns = counts.map(c => {
                const label = (c === 'all') ? t('all') : c;
                const val = (c === 'all') ? 'all' : c;
                return `<button class="opt ${String(state.count) === String(val) ? 'sel' : ''}" onclick="pick('count','${val}')">${label}</button>`;
            }).join('');

            app.innerHTML = `
                <h1>${t('title')}</h1>
                <p class="sub">${t('sub')}</p>

                <div id="reviewCta"></div>

                <div class="field">
                    <div class="field-label">${t('whichTest')}</div>
                    <div class="opts">
                        <button class="opt ${state.test === '100' ? 'sel' : ''}" onclick="pick('test','100')">${t('t100')}<small>${t('t100s')}</small></button>
                        <button class="opt ${state.test === '128' ? 'sel' : ''}" onclick="pick('test','128')">${t('t128')}<small>${t('t128s')}</small></button>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">${t('topic')}</div>
                    <div class="opts">${catBtns}</div>
                </div>

                <div class="field">
                    <div class="field-label">${t('howMany')}</div>
                    <div class="opts">${countBtns}</div>
                </div>

                <div class="field">
                    <div class="field-label">${t('stateLabel')}</div>
                    <select class="state-select" onchange="pick('userState', this.value)">
                        <option value="">${t('stateNone')}</option>
                        ${STATE_NAMES.map(s => `<option value="${s}" ${state.userState === s ? 'selected' : ''}>${s}</option>`).join('')}
                    </select>
                </div>

                <button class="btn-primary" id="startBtn" onclick="startStudy()">${t('start')}</button>
                <p class="note">${t('noteEng')}</p>
            `;
            updateReviewCta();
        }

        function pick(field, value) {
            if (field === 'count') state.count = (value === 'all') ? 'all' : parseInt(value, 10);
            else state[field] = value;
            if (field === 'test') state.category = 'all'; // categories differ per test
            renderSetup();
        }

        async function startStudy() {
            document.getElementById('loadingText').textContent = t('loading');
            document.getElementById('loadingOverlay').classList.remove('hidden');
            const bank = await loadBank(state.test, state.userState);
            document.getElementById('loadingOverlay').classList.add('hidden');

            let pool = bank;
            if (state.category !== 'all') {
                const cat = categoriesFor(state.test).find(c => c.key === state.category);
                pool = bank.filter(q => q.n >= cat.min && q.n <= cat.max);
            }
            pool = shuffle(pool);
            if (state.count !== 'all') pool = pool.slice(0, state.count);

            state.working = pool;
            state.statsSaved = false;
            state.index = 0;
            state.known = 0;
            state.missed = [];
            state.revealed = false;
            state.screen = 'study';
            render();
            speakQuestion();
        }

        // ---------- Text-to-speech (neural MP3 if available, else best browser voice; see tts.js) ----------
        function speak(text, voiceLang) { window.speakText(text, voiceLang || 'en-US', 0.95); }
        function stopSpeech() { window.ttsStop(); }
        function speakQuestion() { const q = state.working[state.index]; if (q) speak(q.q, 'en-US'); }
        function speakAnswer() { const q = state.working[state.index]; if (q) speak(q.a, 'en-US'); }

        function renderStudy() {
            const q = state.working[state.index];
            const total = state.working.length;
            const pct = Math.round((state.index / total) * 100);
            app.innerHTML = `
                <div class="progress">
                    <button class="btn-exit" onclick="exitStudy()">${t('exit')}</button>
                    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                    <div class="progress-text">${t('qof')(state.index + 1, total)}</div>
                </div>
                <div class="card">
                    <div class="q-num">Q${q.n}</div>
                    <div class="q-text">${escapeHtml(q.q)} <button class="btn-speak" onclick="speakQuestion()" title="Hear">🔊</button></div>
                    <div class="answer ${state.revealed ? 'show' : ''}" id="answerBox">
                        <div class="lbl">${t('official')}</div>
                        <div class="txt">${escapeHtml(q.a)} <button class="btn-speak" onclick="speakAnswer()" title="Hear">🔊</button></div>
                    </div>
                    ${state.revealed
                        ? `<div class="card-actions">
                               <button class="btn-miss" onclick="mark(false)">${t('miss')}</button>
                               <button class="btn-known" onclick="mark(true)">${t('known')}</button>
                           </div>`
                        : `<button class="btn-primary" style="width:100%;" onclick="reveal()">${t('show')}</button>`
                    }
                </div>
            `;
        }

        function reveal() { state.revealed = true; renderStudy(); speakAnswer(); }

        function exitStudy() { stopSpeech(); state.screen = 'setup'; state.revealed = false; render(); }

        function mark(knewIt) {
            if (knewIt) state.known++;
            else state.missed.push(state.working[state.index]);
            state.index++;
            state.revealed = false;
            if (state.index >= state.working.length) { stopSpeech(); state.screen = 'results'; render(); }
            else { renderStudy(); speakQuestion(); }
        }

        function renderResults() {
            const total = state.working.length;
            const k = state.known;
            const good = (k / total) >= 0.6;
            if (!state.statsSaved) { state.statsSaved = true; saveSession('civics', total, k); }
            app.innerHTML = `
                <div class="result-card">
                    <div class="result-emoji">${good ? '🎉' : '💪'}</div>
                    <h1>${t('done')}</h1>
                    <div class="result-score">${t('score')(k, total)}</div>
                    <div class="result-actions">
                        ${state.missed.length ? `<button class="btn-primary" onclick="redoMissed()">${t('redoMissed')} (${state.missed.length})</button>` : ''}
                        <button class="btn-ghost" onclick="state.screen='setup'; render();">${t('again')}</button>
                        <a href="dashboard.html" class="btn-ghost" style="text-decoration:none; text-align:center;">${t('toHub')}</a>
                    </div>
                </div>
            `;
        }

        function redoMissed() {
            state.working = shuffle(state.missed);
            state.index = 0; state.known = 0; state.missed = []; state.revealed = false; state.statsSaved = false;
            state.screen = 'study'; render();
            speakQuestion();
        }

        // ---------- Repaso de hoy (repaso espaciado) ----------
        // Practicar recuperando la respuesta y espaciar los repasos son las dos técnicas con mayor utilidad
        // en la revisión de Dunlosky et al. (2013). Los intervalos son una regla práctica, no un valor probado.
        // El progreso se guarda en este navegador, por usuario y por examen (100 / 128).
        const REV_INTERVAL = { 1: 1, 2: 2, 3: 4, 4: 8, 5: 16 };   // días por nivel
        const REV_SESSION = 10;                                    // tarjetas por sesión (repasos + nuevas)
        const REV_NEW_PER_DAY = 10;                                // preguntas nuevas máximo por día
        const REV_WAIT = 3;                                        // segundos para pensar antes de ver la respuesta
        let reviewUid = 'anon';
        let review = null;
        let reviewTimer = null;

        function todayNum() { return Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000); }
        function revKey(test) { return 'civicsReview.v1.' + reviewUid + '.' + test; }
        function revLoad(test) {
            try { const r = localStorage.getItem(revKey(test)); if (r) { const o = JSON.parse(r); if (o && o.cards) return o; } } catch (e) {}
            return { cards: {} };
        }
        function revSave(test, data) { try { localStorage.setItem(revKey(test), JSON.stringify(data)); } catch (e) {} }

        function revPlan(bank, data) {
            const today = todayNum();
            const due = bank.filter(q => data.cards[q.n] && data.cards[q.n].box > 0 && data.cards[q.n].due <= today)
                            .sort((a, b) => (data.cards[a.n].box - data.cards[b.n].box) || (a.n - b.n));
            const fresh = bank.filter(q => !data.cards[q.n]).sort((a, b) => a.n - b.n);
            const newToday = (data.newDay === today) ? (data.newCount || 0) : 0;
            const room = Math.min(Math.max(0, REV_NEW_PER_DAY - newToday), Math.max(0, REV_SESSION - due.length));
            return { due: due, fresh: fresh.slice(0, room) };
        }

        async function updateReviewCta() {
            const el = document.getElementById('reviewCta');
            if (!el) return;
            const test = state.test;
            let bank;
            try { bank = await loadBank(test, state.userState); } catch (e) { return; }
            const el2 = document.getElementById('reviewCta');
            if (!el2 || test !== state.test || state.screen !== 'setup' || !bank || !bank.length) return;
            const data = revLoad(test);
            const p = revPlan(bank, data);
            const n = p.due.length + p.fresh.length;
            const mastered = bank.filter(q => data.cards[q.n] && data.cards[q.n].box === 5).length;
            const today = todayNum();
            const tmr = Object.keys(data.cards).filter(k => data.cards[k].box > 0 && data.cards[k].due === today + 1).length;
            if (n) {
                const steps = t('revSteps').map(x => '<li>' + x + '</li>').join('');
                el2.innerHTML = `
                    <div class="review-cta">
                        <div class="rc-text">
                            <div class="rc-title">${t('revTitle')}</div>
                            <div class="rc-sub">${t('revSub')(p.due.length, p.fresh.length)} · ${t('revMastered')(mastered, bank.length)}</div>
                            <ol class="rc-steps">${steps}</ol>
                            <div class="rc-hint">${t('revLimit')}</div>
                        </div>
                        <button class="btn-primary" onclick="startReview()">${t('revStart')(n)}</button>
                    </div>`;
            } else {
                el2.innerHTML = `
                    <div class="review-cta done">
                        <div class="rc-text">
                            <div class="rc-title">${t('revDoneToday')}</div>
                            <div class="rc-sub">${t('revTomorrow')(tmr)} · ${t('revMastered')(mastered, bank.length)}</div>
                            <div class="rc-hint">${t('revMoreHint')}</div>
                        </div>
                        <button class="btn-ghost" onclick="goPractice()">${t('revMore')}</button>
                    </div>`;
            }
        }

        function goPractice() {
            const b = document.getElementById('startBtn');
            if (!b) return;
            b.scrollIntoView({ behavior: 'smooth', block: 'center' });
            try { b.focus({ preventScroll: true }); } catch (e) {}
        }

        async function startReview() {
            document.getElementById('loadingText').textContent = t('revLoading');
            document.getElementById('loadingOverlay').classList.remove('hidden');
            let bank;
            try { bank = await loadBank(state.test, state.userState); }
            catch (e) { document.getElementById('loadingOverlay').classList.add('hidden'); return; }
            document.getElementById('loadingOverlay').classList.add('hidden');
            const data = revLoad(state.test);
            const p = revPlan(bank, data);
            const list = p.due.concat(p.fresh);
            if (!list.length) { renderSetup(); return; }
            const byN = {};
            bank.forEach(q => { byN[q.n] = q; });
            review = { test: state.test, data: data, byN: byN, queue: list.map(q => q.n), total: list.length,
                       known: 0, missed: 0, lapsed: {}, phase: 'think', left: REV_WAIT };
            state.screen = 'review';
            reviewThink();
        }

        function reviewThink() {
            clearTimeout(reviewTimer);
            review.phase = 'think';
            review.left = REV_WAIT;
            render();
            reviewSpeakQ();
            reviewTick();
        }
        function reviewTick() {
            if (!review || review.phase !== 'think' || state.screen !== 'review') return;
            if (review.left <= 0) return;
            reviewTimer = setTimeout(() => { review.left--; renderReview(); reviewTick(); }, 1000);
        }
        function reviewCurrent() { return review ? review.byN[review.queue[0]] : null; }
        function reviewSpeakQ() { const q = reviewCurrent(); if (q) speak(q.q, 'en-US'); }
        function reviewSpeakA() { const q = reviewCurrent(); if (q) speak(q.a, 'en-US'); }

        function renderReview() {
            if (!review) return;
            const q = reviewCurrent();
            const c = review.data.cards[q.n];
            const pct = Math.round((review.total - review.queue.length) / review.total * 100);
            const tag = review.lapsed[q.n] ? t('revAgainTag') : (c && c.box > 0 ? t('lv' + c.box) : t('revNewTag'));
            let body;
            if (review.phase === 'think') {
                const ready = review.left <= 0;
                body = `<div class="think">${t('revThink')}</div>
                        <button class="btn-primary" style="width:100%;" ${ready ? '' : 'disabled'} onclick="reviewReveal()">${t('revShow')}${ready ? '' : ' (' + review.left + ')'}</button>`;
            } else {
                body = `<div class="answer show">
                            <div class="lbl">${t('official')}</div>
                            <div class="txt">${escapeHtml(q.a)} <button class="btn-speak" onclick="reviewSpeakA()" title="Hear">🔊</button></div>
                        </div>
                        <div class="card-actions">
                            <button class="btn-miss" onclick="reviewRate(false)">${t('revMiss')}<small>${t('revMissSub')}</small></button>
                            <button class="btn-known" onclick="reviewRate(true)">${t('revKnown')}<small>${t('revKnownSub')}</small></button>
                        </div>`;
            }
            app.innerHTML = `
                <div class="progress">
                    <button class="btn-exit" onclick="exitReview()">${t('exit')}</button>
                    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                    <div class="progress-text">${t('revLeft')(review.queue.length)}</div>
                </div>
                <div class="card">
                    <div class="q-num">Q${q.n} · ${tag}</div>
                    <div class="q-text">${escapeHtml(q.q)} <button class="btn-speak" onclick="reviewSpeakQ()" title="Hear">🔊</button></div>
                    ${body}
                </div>`;
        }

        function reviewReveal() {
            if (!review || review.left > 0) return;
            clearTimeout(reviewTimer);
            review.phase = 'reveal';
            renderReview();
            reviewSpeakA();
        }

        function reviewRate(knew) {
            const n = review.queue.shift();
            const today = todayNum();
            const cards = review.data.cards;
            let c = cards[n];
            if (!c) {
                c = cards[n] = { box: 0, due: today };
                const d = review.data;
                if (d.newDay !== today) { d.newDay = today; d.newCount = 0; }
                d.newCount++;
            }
            if (knew) {
                if (review.lapsed[n]) { delete review.lapsed[n]; }          // la recordó tras repasar: ya queda para mañana
                else { c.box = (c.box === 0) ? 2 : Math.min(5, c.box + 1); c.due = today + REV_INTERVAL[c.box]; review.known++; }
            } else {
                if (!review.lapsed[n]) review.missed++;
                c.box = 1; c.due = today + 1; review.lapsed[n] = true;       // si sale de la sesión, igual vuelve mañana
                review.queue.splice(Math.min(3, review.queue.length), 0, n); // reaparece en unas tarjetas
            }
            revSave(review.test, review.data);
            if (!review.queue.length) reviewFinish(); else reviewThink();
        }

        function reviewFinish() {
            clearTimeout(reviewTimer);
            stopSpeech();
            const today = todayNum();
            const cards = review.data.cards;
            review.tomorrow = Object.keys(cards).filter(k => cards[k].box > 0 && cards[k].due === today + 1).length;
            saveSession('civics', review.total, review.known);
            state.screen = 'reviewDone';
            render();
        }

        function renderReviewDone() {
            if (!review) { state.screen = 'setup'; render(); return; }
            app.innerHTML = `
                <div class="result-card">
                    <div class="result-emoji">🎉</div>
                    <h1>${t('revDoneTitle')}</h1>
                    <div class="rv-sum">
                        <div><b>${review.known} / ${review.total}</b><span>${t('revFirstTry')}</span></div>
                        <div><b>${review.missed}</b><span>${t('revToMorrow')}</span></div>
                    </div>
                    <p class="rv-note">${t('revTomorrow')(review.tomorrow)}</p>
                    <div class="result-actions">
                        <button class="btn-primary" onclick="leaveReview()">${t('revBack')}</button>
                    </div>
                </div>`;
        }

        function exitReview() { clearTimeout(reviewTimer); stopSpeech(); review = null; state.screen = 'setup'; render(); }
        function leaveReview() { review = null; state.screen = 'setup'; render(); }

        function escapeHtml(s) { return String(s).replace(/</g, '&lt;'); }

        // ---------- Init ----------
        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            reviewUid = (session.user && session.user.id) || 'anon';
            setLang(lang); // sets toggles + back button + renders
            document.getElementById('loadingOverlay').classList.add('hidden');
        }
        init();

        // --- Estadísticas: guarda la sesión de práctica en Supabase ---
        async function saveSession(mode, questions, correct) {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) return;
                const score = (correct !== null && correct !== undefined && questions > 0)
                    ? Math.round((correct / questions) * 100) : null;
                await supabaseClient.from('practice_sessions').insert({
                    user_id: user.id, mode: mode, questions: questions, correct: correct, score: score
                });
            } catch (e) { console.log('saveSession skipped:', e); }
        }
    </script>
</body>
</html>
